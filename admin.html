<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESMA Portal - Admin Client Onboarding</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');

  :root {
    --eu-blue: #003399;
    --border: #d8dee4;
    --text-dark: #333333;
    --danger: #d43c39;
    --success: #2e7d32;
  }

  body {
    font-family: 'Roboto', sans-serif;
    background-color: #f3f6f7;
    margin: 0;
    padding: 40px 20px;
    color: var(--text-dark);
  }

  .admin-card {
    max-width: 520px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 35px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
  }

  h2 {
    color: var(--eu-blue);
    margin-top: 0;
    font-size: 22px;
    border-bottom: 2px solid var(--eu-blue);
    padding-bottom: 10px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 6px;
    color: #475569;
  }

  input[type="text"],
  input[type="email"],
  input[type="password"],
  input[type="number"],
  select {
    width: 100%;
    padding: 11px;
    border: 1px solid #8d959b;
    border-radius: 2px;
    font-size: 14px;
    box-sizing: border-box;
  }

  input:focus, select:focus {
    outline: 2px solid var(--eu-blue);
    border-color: transparent;
  }

  .divider {
    margin: 25px 0;
    border: 0;
    border-top: 1px solid var(--border);
  }

  .btn-submit {
    background: var(--eu-blue);
    color: #ffffff;
    border: none;
    padding: 14px;
    width: 100%;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }

  .btn-submit:hover {
    background: #002673;
  }

  #statusMessage {
    margin-top: 20px;
    font-size: 14px;
    text-align: center;
    font-weight: 700;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="admin-card">
  <h2>ESMA Client Generator</h2>
  
  <div class="form-group">
    <label>GitHub Personal Access Token (PAT)</label>
    <input type="password" id="ghToken" placeholder="ghp_..." required autocomplete="off">
  </div>
  
  <div class="form-group">
    <label>GitHub Repository Path (username/repository)</label>
    <input type="text" id="ghRepo" placeholder="your-username/your-repo-name" required autocomplete="off">
  </div>

  <hr class="divider">

  <div class="form-group">
    <label>Full Legal Name</label>
    <input type="text" id="clientName" placeholder="e.g. Colin Francis Ware" required>
  </div>

  <div class="form-group">
    <label>Registered Email Address</label>
    <input type="email" id="clientEmail" placeholder="e.g. colin5466@gmail.com" required>
  </div>

  <div class="form-group">
    <label>Date of Asset Restraint</label>
    <input type="text" id="clientDate" placeholder="e.g. September 8th, 2026" required>
  </div>

  <div class="form-group">
    <label>Currency</label>
    <select id="clientCurrency">
      <option value="EUR">EUR (€)</option>
      <option value="USD">USD ($)</option>
      <option value="GBP">GBP (£)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Restrained Amount (Numeric value only)</label>
    <input type="number" step="0.01" id="clientAmount" placeholder="e.g. 11960.03" required>
  </div>

  <div class="form-group">
    <label>Guarantee Rate % (e.g. 15 for 15%)</label>
    <input type="number" step="0.1" id="clientRate" placeholder="e.g. 15" required>
  </div>

  <div class="form-group">
    <label>Escrow Wallet Address</label>
    <input type="text" id="clientWallet" placeholder="0x..." required autocomplete="off">
  </div>

  <button class="btn-submit" onclick="dispatchNewClient()">AUTOMATICALLY ADD CLIENT</button>

  <div id="statusMessage"></div>
</div>

<script>
async function dispatchNewClient() {
  const token = document.getElementById('ghToken').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const status = document.getElementById('statusMessage');

  const name = document.getElementById('clientName').value.trim();
  const email = document.getElementById('clientEmail').value.trim().toLowerCase();
  const date = document.getElementById('clientDate').value.trim();
  const currency = document.getElementById('clientCurrency').value;
  const amount = document.getElementById('clientAmount').value;
  const rate = document.getElementById('clientRate').value;
  const wallet = document.getElementById('clientWallet').value.trim();

  if (!token || !repo) {
    status.style.color = "var(--danger)";
    status.innerHTML = "Please enter your GitHub Token and Repository path.";
    return;
  }

  if (!name || !email || !date || !amount || !rate || !wallet) {
    status.style.color = "var(--danger)";
    status.innerHTML = "Please complete all client information fields.";
    return;
  }

  const payload = {
    event_type: "add_client",
    client_payload: {
      name: name,
      email: email,
      date: date,
      currency: currency,
      amount: amount,
      rate: rate,
      wallet: wallet
    }
  };

  status.style.color = "var(--eu-blue)";
  status.innerHTML = "Dispatching client to GitHub Actions...";

  try {
    const response = await fetch(`https://api.github.com/repos/${repo}/dispatches`, {
      method: 'POST',
      headers: {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': `token ${token}`
      },
      body: JSON.stringify(payload)
    });

    if (response.ok || response.status === 204) {
      status.style.color = "var(--success)";
      status.innerHTML = "✓ Request sent successfully!<br>GitHub Actions is updating index.html (takes ~1 minute).";
    } else {
      status.style.color = "var(--danger)";
      status.innerHTML = "✗ GitHub Error: Verify token permissions (repo scope) or repository path.";
    }
  } catch (err) {
    status.style.color = "var(--danger)";
    status.innerHTML = "✗ Network error: Could not reach GitHub API.";
  }
}
</script>

</body>
</html>
